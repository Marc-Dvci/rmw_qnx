# On every push: the host tests of rmw_qnx's core (ring buffer, CDR framing, name encoding) in random order, with
# line and branch coverage of the core on the run page, and the trace-summary tool's tests. No QNX SDP, guest,
# network service or key is needed. The QNX build itself needs the SDP licence and runs locally (README, "Build").
# Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts are executable from a clean clone
        run: test -z "$(git ls-files -s '*.sh' | grep '^100644')"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtest-dev gcovr
      - name: Host tests, random order, with coverage
        run: COVERAGE=1 bash scripts/host_tests.sh build/host | tee host-tests.log
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          {
            echo "### Core tests (host)"
            echo
            grep -E "tests from .* ran|PASSED|FAILED" host-tests.log
            echo
            echo "### Coverage of rmw_qnx/core"
            echo
            echo '```'
            grep -E "lines:|branches:" host-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Spelling
        run: codespell
      - name: Links and anchors in the README and docs
        run: python scripts/check_links.py
      - name: Trace summary tests, random order
        run: python -m pytest -q tests/tools | tee tools.log
      - name: Summary on the run page
        if: always()
        run: |
          {
            echo "### Trace summary tool"
            echo
            tail -n 1 tools.log
          } >> "$GITHUB_STEP_SUMMARY"
