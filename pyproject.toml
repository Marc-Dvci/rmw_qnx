# Tool settings only: the Python here is host tooling (trace decoding, summaries, figures), not an installed package.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, bugbear, import order
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/tools"]
addopts = "-ra --strict-markers"
timeout = 30

[tool.codespell]
skip = "*.png,*.jpg,*.gif,*.svg,*.lock,.git,.venv,*.kev,*.trace,*.pinv,./results"
# empy is the template package ROS 2 builds with.
ignore-words-list = "empy"
